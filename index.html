/* ============ Primitivas de dibujo ============ */

function T(s,x,y,sz,col,al='left',b=false,mono=false){
 s=String(s);const tot=tw(s,sz,b,mono);let cx=al==='center'?x-tot/2:al==='right'?x-tot:x;
 ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle=Array.isArray(col)?C(col):col;
 for(const p of s.split(/(_\{[^}]*\})/)){if(!p)continue;const sub=p.startsWith('_{'),t=sub?p.slice(2,-1):p;ctx.font=`${b?'700 ':''}${sub?sz*.72:sz}px ${mono?MONO:SANS}`;ctx.fillText(t,cx,y+(sub?sz*.22:0));cx+=ctx.measureText(t).width}

function wrap(s,w,sz,b){const out=[];let l='';for(const wd of s.split(' ')){const tr=(l+' '+wd).trim();if(l&&tw(tr,sz,b)>w){out.push(l);l=wd}else l=tr}out.push(l);return out}
function para(s,x,y,w,sz,col,lh,b){const L=wrap(s,w,sz,b);L.forEach((l,i)=>T(l,x,y+i*lh+lh/2,sz,col,'left',b));return L.length}

/* ============ Física y Newton-Raphson ============ */
const coef=(v,d)=>G*d*d/(2*v*v);
const fA=(X,c,h,d,s)=>{const t=s*Math.tan(X);return d*t-c*(1+t*t)-h};

function makeProblem(ri,avoid){
 for(;;){
  let side,group,kind;
  if(ri===0){kind='plano';side=1;group='bajo'}else{side=wch([1,-1],[7,3]);group=wch(['bajo','alto'],[8,3]);kind=wch(['plano','valle','colina','cumbre'],group==='alto'?[1,1,4,5]:[2,2,4,1])}
  const target=ri===0?2:Math.floor(Math.random()*3);
  for(let it=0;it<900;it++){
   const dist=ri===0?rr(200,501,10):rr(DMIN,DMAX+1,10),phi0=ri===0?rnd(10,30):group==='bajo'?rnd(8,42):rnd(50,80),cap=40+5.5*Math.max(0,phi0-20);let h;
   if(kind==='plano')h=0;else if(kind==='valle')h=-rr(10,65,5);
   else if(kind==='colina'){if(cap<25)continue;const top=Math.floor(Math.min(150,cap));h=rr(Math.max(10,Math.floor(top*.45)),top,5)}
   else{if(cap<=160)continue;h=rr(Math.max(150,Math.floor(cap*.6)),Math.floor(cap),5)}
   const t0=Math.tan(rad(phi0)),gap=dist*t0-h;if(gap<=0)continue;
   const speed=Math.round(dist*Math.sqrt(G*(1+t0*t0)/(2*gap)));if(speed<25||speed>260)continue;
   const c=coef(speed,dist),disc=dist*dist-4*c*(c+h);if(disc<=0)continue;
   const sq=Math.sqrt(disc),lo_=(dist-sq)/(2*c),hi_=(dist+sq)/(2*c);
   const T_=Math.abs(Math.atan(lo_)-rad(phi0))<=Math.abs(Math.atan(hi_)-rad(phi0))?lo_:hi_,phi=deg(Math.atan(T_));
   if(Math.abs(phi-phi0)>6||phi<6||phi>85)continue;
   const arc=T_>dist/(2*c)?'alto':'bajo',rootDeg=side===1?phi:180-phi,root=rad(rootDeg),[lo,hi]=side===1?[3,88]:[92,177],sg=Math.random()<.5?-1:1;
   let off,dg;
   if(target===0){off=rnd(-.003,.003);dg=3}else if(target===1){off=sg*(arc==='bajo'?rnd(.2,1.2):rnd(.1,.6));dg=2}else{off=sg*(arc==='bajo'?rnd(4,9):rnd(1.5,5));dg=0}
   const seed=+clamp(rootDeg+off,lo,hi).toFixed(dg),steps=newton(rad(seed),c,h,dist,side,3);if(steps.length<3)continue;
   if(steps.findIndex(st=>Math.abs(st.X-root)<=rad(TOL))!==target)continue;
   const plateau=h-TM;if(!clear(root,c,plateau,dist,side))continue;
   const pool=SC[kind].filter(x=>x[0]!==avoid),[title,story,tname]=ch(pool.length?pool:SC[kind]);
   return{kind,speed,height:h,c,plateau,seed,rootDeg,steps,dist,side,arc,title,story:story.replace('{lado}',side<0?'a tu izquierda':'a tu derecha'),tname,ans:target}}}}
function buildHints(p){
 const r=p.rootDeg,lo=Math.floor(r),a0=Math.floor(r-rnd(.15,.85)*5),th1=deg(p.steps[0].nxt);
 const ex=p.side<0&&p.arc==='alto'?' Tiro alto a la izquierda: el ángulo está entre 90° y 140°.':p.side<0?' A tu izquierda: el ángulo será mayor que 90°.':p.arc==='alto'?' Tiro alto: el ángulo será mayor que 45°.':'';
 const s3=p.ans===2?['Usa la semilla',`Empieza con la semilla X_{0} = ${fd(p.seed)}°. La tabla muestra 3 iteraciones seguidas: una de sus filas guarda la respuesta.`,null]:['Lee la tabla','La tabla muestra 3 iteraciones seguidas. Cuando X casi no cambia de una fila a otra, ahí está la respuesta.',null];
 const s4=p.ans===2?['Primera corrección',`X_{1} = X_{0} - f(X_{0}) / f'(X_{0}) = ${th1.toFixed(3)}°. Ya estás más cerca.`,null]:['Aplica la fórmula','Cada vez que usas la fórmula, X cambia menos. La fila donde casi no cambia tiene la respuesta.',null];
 return[['Entiende f(X)','f(X) mide cuánto falla la bala en altura al llegar al blanco. Si f(X) = 0, pasa por el centro: busca ese X.'+ex,null],
  ['Acota el ángulo',`El ángulo está entre ${a0}° y ${a0+5}°. Fuera de ese rango no hay solución.`,[a0,a0+5]],s3,s4,
  ['Sigue iterando','Repite la fórmula con el X nuevo. Cada vez el error f(X) se acerca más a 0: míralo en la tabla.',null],
  ['Casi converge',`El ángulo ya está entre ${lo}° y ${lo+1}°. Afina los decimales: la diana exige ±${TOL}°.`,[lo,lo+1]],
  ['Respuesta',`X = ${r.toFixed(3)}°. Escríbelo y dispara. La tabla ya muestra todas las iteraciones.`,null]]}
const revealOrder=a=>{const o=[];for(let r=0;r<3;r++)o.push(3*r+1,3*r+2);for(let r=0;r<a;r++)o.push(3*r);return o};
const cellsRev=(h,a)=>{if(h<=0)return new Set();if(h>=MAXH)return new Set([0,1,2,3,4,5,6,7,8]);const o=revealOrder(a);return new Set(o.slice(0,Math.ceil(o.length*h/(MAXH-1))))};
class Shot{
 constructor(a,p){this.X=rad(a);this.p=p;this.t=0;this.pos=[0,0];this.path=[[0,0]];this.pt=0;this.kind=null;this.impact=null;this.dist=Math.hypot(p.dist,p.height);this.best=this.dist;this.bp=[0,0];this.inside=false}
 advance(dt){const p=this.p,fac=TSCALE*(Math.abs(this.pos[0])>p.dist+150?2.4:1),tx=p.side*p.dist,goal=this.t+dt*fac,touch=BR+BULR;

   this.t=Math.min(goal,this.t+(this.dist<80?.002:.02));
   const x=p.speed*Math.cos(this.X)*this.t,y=p.speed*Math.sin(this.X)*this.t-.5*G*this.t*this.t;this.pos=[x,y];
   if(this.t-this.pt>=.02-1e-9){this.path.push(this.pos);this.pt=this.t}
   const prev=this.dist;this.dist=Math.hypot(x-tx,y-p.height);
   if(this.dist<this.best){this.best=this.dist;this.bp=this.pos}
   if(this.dist<=touch)this.inside=true;
   if(this.inside&&this.dist>prev){this.kind='target';this.impact=this.bp;this.pos=this.bp;this.path.push(this.bp);break}
   const gr=terr(x,p.plateau,p.dist,p.side);
   if(y<=gr){this.kind='ground';this.impact=[x,gr]}else if(this.t>120){this.kind='lost';this.impact=this.pos}}}}
const judge=(s,err)=>s.kind==='target'?(err<=TOL?'diana':'acierto'):(s.best<=NEAR?'cerca':'lejos');
function segDist(a,b,p){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy,t=L<1e-12?0:clamp(((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L,0,1);return Math.hypot(a[0]+t*dx-p[0],a[1]+t*dy-p[1])}

/* ============ Cámara ============ */
function camGoal(p,b){
 const tx=p.side*p.dist,top=p.height+BR+16,low=p.plateau-10,[ml,mr]=p.side>0?[GM,TMG]:[TMG,GM];
 const zf=(xs,hi)=>{const w=Math.max(...xs)-Math.min(...xs);return clamp(Math.min((FW-ml-mr)/Math.max(w,1),(GY-TOPM)/Math.max(hi,1),low<0?(FH-GY-10)/-low:ZMAX,ZMAX),ZMIN,ZMAX)};
 const pl=(xs,z)=>{const w=Math.max(...xs)-Math.min(...xs),sp=Math.max(0,FW-ml-mr-w*z)/2;return[z,Math.min(...xs)-(ml+sp)/z]};
 const bx=[0,tx],zb=zf(bx,top);
 if(b){const xs=[0,tx,b[0]],z=zf(xs,Math.max(top,b[1]+12));return z>=.5*zb?pl(xs,z):pl(bx,.5*zb)}

const cam={zoom:ZREF,x0:0};
function camApproach(g,dt,rate){const k=Math.min(1,dt*rate);cam.zoom*=(g[0]/cam.zoom)**k;cam.x0+=(g[1]-cam.x0)*k}

function saveResult(){if(savedName)return;const name=cleanName(ires.value);if(!name){saveNote=['Escribe un nombre para guardar',BAD];return}
 const st=saveMatch(name,match.points,hitsOf(match),match.shots);

 else if(st==='exists'){saveNote=[`«${name}» ya está registrado: escribe un nombre nuevo`,BAD];ires.value='';ires.focus()}else saveNote=['No se pudo guardar en este navegador',BAD]}

/* ============ Entrada, bucle y ajuste de pantalla ============ */
function act(id){({play:startMatch,fire,hint:useHint,new:newEquation,next:newEquation,save:saveResult,again:startMatch,menu:goMenu,closedrawer:()=>{drawerOpen=false}})[id]?.()}
const hitAt=p=>{for(let i=hot.length-1;i>=0;i--)if(inside(hot[i].r,p))return hot[i].id;return null};
function ptr(e){const b=cv.getBoundingClientRect();return[(e.clientX-b.left)/K,(e.clientY-b.top)/K]}
cv.addEventListener('pointermove',e=>{mouse=ptr(e)});
cv.addEventListener('pointerdown',e=>{mouse=ptr(e);downId=hitAt(mouse);if(state==='play'&&phase==='aim')setTimeout(focusAng,0)});
addEventListener('pointerup',e=>{const p=ptr(e),id=downId;downId=null;if(id&&hitAt(p)===id)act(id)});
cv.addEventListener('pointerleave',()=>{mouse=[-1,-1]});
const clean=(el,re)=>el.addEventListener('input',()=>{const v=el.value.replace(re,'');if(v!==el.value)el.value=v});
clean(iname,/[^\p{L}\p{N} _.\-]/gu);clean(ires,/[^\p{L}\p{N} _.\-]/gu);
iang.addEventListener('input',()=>{let v=iang.value.replace(/[^0-9.,]/g,'');const i=v.search(/[.,]/);if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/[.,]/g,'');if(v!==iang.value)iang.value=v;message=null});
addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(state!=='menu')goMenu();return}
 if(e.key==='Enter'){if(state==='menu')startMatch();else if(state==='result')saveResult();else if(phase==='aim')fire();else if(phase==='solved')newEquation();e.preventDefault()}
 else if(e.key==='Tab'&&state==='play'){e.preventDefault();useHint()}});
function fit(){K=Math.min(innerWidth/W,innerHeight/H);SC_=K*Math.min(devicePixelRatio||1,2);
 wrapEl.style.transform=`translate(${(innerWidth-W*K)/2}px,${(innerHeight-H*K)/2}px) scale(${K})`;cv.width=Math.round(W*SC_);cv.height=Math.round(H*SC_)}
addEventListener('resize',fit);fit();
let last=performance.now(),vis={};
function setVis(el,v){if(vis[el.id]!==v){el.style.display=v?'block':'none';vis[el.id]=v}}
function frame(t){
 requestAnimationFrame(frame);const raw=Math.min((t-last)/1000,.25);last=t;hot=[];
 try{update(Math.min(raw,.05),raw)}catch(err){console.error(err)}
 ctx.setTransform(SC_,0,0,SC_,0,0);ctx.fillStyle=C(BG);ctx.fillRect(0,0,W,H);
 if(state==='menu')drawMenu();else if(state==='play')drawPlay();else drawResult();
 setVis(iname,state==='menu');setVis(iang,state==='play');setVis(ires,state==='result'&&!savedName);
 const en=state==='play'&&phase==='aim';if(iang.disabled===en)iang.disabled=!en;
 cv.style.cursor=hot.some(h=>inside(h.r,mouse))?'pointer':'default'}
requestAnimationFrame(frame);
